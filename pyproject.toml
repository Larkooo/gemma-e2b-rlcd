[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-e2b-rlcd"
version = "0.5.0"
description = "Parallel multimodal classification and grading with Gemma 4 E2B"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Larkooo"}]
keywords = ["gemma", "mlx", "multimodal", "classification", "rlcd"]
requires-python = ">=3.12"
dependencies = ["mlx-vlm==0.7.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
web = ["fastapi", "uvicorn", "python-multipart"]

[project.urls]
Repository = "https://github.com/Larkooo/gemma-e2b-rlcd"
Issues = "https://github.com/Larkooo/gemma-e2b-rlcd/issues"

[project.scripts]
gemma-rlcd = "gemma_rlcd.cli:main"
gemma-rlcd-web = "gemma_rlcd.web:main"

[tool.setuptools.package-data]
gemma_rlcd = ["static/*"]

[tool.setuptools.packages.find]
include = ["gemma_rlcd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
