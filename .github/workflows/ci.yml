name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install portable test dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install pytest ruff httpx fastapi uvicorn python-multipart pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check Python and browser code
        run: |
          ruff check gemma_rlcd tests scripts
          ruff format --check gemma_rlcd tests scripts
          node --check gemma_rlcd/static/app.js
          node --check gemma_rlcd/static/demo.js
          node --test tests/test_demo.cjs
      - name: Run contract and web tests
        run: python -m pytest -q
        # MLX-only tests skip on Linux. Full model inference is a local check.
